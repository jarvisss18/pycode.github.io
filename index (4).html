<script type="text/plain" id="c1">
#include<stdio.h>
#include<conio.h>

void selectionsort(int a[], int n) {
    int i,j,temp,min;
    for(i=0;i<n-1;i++)
    {
        min=i;
        for(j=i+1;j<n;j++)
        {
            if(a[j]<a[min])
            {
                min=j;
            }
        }
        temp=a[i];
        a[i]=a[min];
        a[min]=temp;
    }
}

int main() {
    int a[100],i,n;
    printf("\n enter no of elements=");
    scanf("%d",&n);
    printf("\n enter elements=");
    for(i=0;i<n;i++)
    {
        scanf("%d",&a[i]);
    }
    selectionsort(a,n);
    printf("\n sorted array is:");
    for(i=0;i<n;i++)
    {
        printf(" %d",a[i]);
    }
    return 0;
}
</script>

<script type="text/plain" id="c2">
#include<stdio.h>
#include<conio.h>

void insertionsort(int a[], int n) {
    int i,j,temp;
    for(i=1;i<n;i++)
    {
        temp=a[i];
        j=i-1;
        while(j>=0 && a[j]>temp)
        {
            a[j+1]=a[j];
            j--;
        }
        a[j+1]=temp;
    }
}

<script type="text/plain" id="c3">
#include <stdio.h>
#include <conio.h>

void quicksort(int a[], int lb, int ub) {
    int start, end, pivot, temp;
    if (lb < ub)
    {
        pivot = a[lb];
        start = lb;
        end = ub;
        while (start < end)
        {
            while (a[start] <= pivot && start < ub)
            {
                start++;
            }
            while (a[end] > pivot)
            {
                end--;
            }
            if (start < end)
            {
                temp = a[start];
                a[start] = a[end];
                a[end] = temp;
            }
        }
        temp = a[lb];
        a[lb] = a[end];
        a[end] = temp;
        quicksort(a, lb, end - 1);
        quicksort(a, end + 1, ub);
    }
}

int main() {
    int a[100], i, n;
    clrscr();
    printf("\nEnter no of elements = ");
    scanf("%d", &n);
    printf("\nEnter elements = ");
    for (i = 0; i < n; i++)
    {
        scanf("%d", &a[i]);
    }
    quicksort(a, 0, n - 1);
    printf("\nSorted array is: ");
    for (i = 0; i < n; i++)
    {
        printf("%d ", a[i]);
    }
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c4">
#include<stdio.h>
#include<conio.h>

int binarysearch(int a[], int n, int key) {
    int low=0,high=n-1,mid;
    while(low<=high)
    {
        mid=(low+high)/2;
        if(a[mid]==key)
            return mid;
        else if(key<a[mid])
            high=mid-1;
        else
            low=mid+1;
    }
    return -1;
}

int main() {
    int a[100],i,n,key,result;
    clrscr();
    printf("\n enter no of elements=");
    scanf("%d",&n);
    printf("\n enter elements=");
    for(i=0;i<n;i++)
    {
        scanf("%d",&a[i]);
    }
    printf("\n enter the element to be searched=");
    scanf("%d",&key);
    result=binarysearch(a,n,key);
    if (result==-1)
        printf("\n element not found");
    else
        printf("\n element is found at position=%d",result+1);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c5">
#include<stdio.h>
#include<conio.h>

void knapsack(int n,float w[],float p[],float m) {
    float r[100],temp,profit=0;
    int i,j;
    for(i=0;i<n;i++)
    {
        r[i]=p[i]/w[i];
    }
    for(i=0;i<n-1;i++)
    {
        for(j=i+1;j<n;j++)
        {
            if(r[i]<r[j])
            {
                temp=r[i];
                r[i]=r[j];
                r[j]=temp;
                temp=w[i];
                w[i]=w[j];
                w[j]=temp;
                temp=p[i];
                p[i]=p[j];
                p[j]=temp;
            }
        }
    }
    for(i=0;i<n;i++)
    {
        if(w[i]<=m)
        {
            profit=profit+p[i];
            m=m-w[i];
        }
        else
        {
            profit=profit+(p[i]*m/w[i]);
            break;
        }
    }
    printf("\n maximum profit=%f",profit);
}

int main() {
    float w[100],p[100],m;
    int i,n;
    clrscr();
    printf("\n enter no of items=");
    scanf("%d",&n);
    printf("\n enter weights=");
    for(i=0;i<n;i++)
        scanf("%f",&w[i]);
    printf("\n enter profits=");
    for(i=0;i<n;i++)
        scanf("%f",&p[i]);
    printf("\n enter capacity=");
    scanf("%f",&m);
    knapsack(n,w,p,m);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c6">
#include<stdio.h>
#include<conio.h>

int parent[100];

int find(int i) {
    while(parent[i]!=i)
        i=parent[i];
    return i;
}

void kruskal(int n,int cost[100][100]) {
    int i,j,a,b,u,v,min,ne=0,mincost=0;
    for(i=0;i<n;i++)
        parent[i]=i;
    while(ne<n-1)
    {
        min=9999;
        for(i=0;i<n;i++)
        {
            for(j=0;j<n;j++)
            {
                if(cost[i][j]<min&&cost[i][j]!=0)
                {
                    min=cost[i][j];
                    a=u=i;
                    b=v=j;
                }
            }
        }
        u=find(u);
        v=find(v);
        if(u!=v)
        {
            printf("\n edge %d-%d cost=%d",a+1,b+1,min);
            parent[v]=u;
            mincost=mincost+min;
            ne++;
        }
        cost[a][b]=cost[b][a]=9999;
    }
    printf("\n minimum cost=%d",mincost);
}

int main() {
    int cost[100][100],i,j,n;
    clrscr();
    printf("\n enter no of vertices=");
    scanf("%d",&n);
    printf("\n enter cost matrix (0 for no edge)=");
    for(i=0;i<n;i++)
    {
        for(j=0;j<n;j++)
            scanf("%d",&cost[i][j]);
    }
    kruskal(n,cost);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c7">
#include<stdio.h>
#include<conio.h>

void prim(int cost[100][100],int n) {
    int visited[100],i,j,a,b,min,ne=0,mincost=0;
    for(i=0;i<n;i++)
        visited[i]=0;
    visited[0]=1;
    while(ne<n-1)
    {
        min=9999;
        for(i=0;i<n;i++)
        {
            if(visited[i]==1)
            {
                for(j=0;j<n;j++)
                {
                    if(visited[j]==0&&cost[i][j]!=0&&cost[i][j]<min)
                    {
                        min=cost[i][j];
                        a=i;
                        b=j;
                    }
                }
            }
        }
        if(min==9999)
        {
            printf("\n graph is not connected");
            return;
        }
        printf("\n edge %d-%d cost=%d",a+1,b+1,min);
        mincost=mincost+min;
        visited[b]=1;
        ne++;
    }
    printf("\n minimum cost=%d",mincost);
}

int main() {
    int cost[100][100],i,j,n;
    clrscr();
    printf("\n enter no of vertices=");
    scanf("%d",&n);
    printf("\n enter cost matrix (0 for no edge)=");
    for(i=0;i<n;i++)
    {
        for(j=0;j<n;j++)
            scanf("%d",&cost[i][j]);
    }
    prim(cost,n);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c8">
#include<stdio.h>
#include<conio.h>

int max(int a,int b) {
    if(a>b)
        return a;
    else
        return b;
}

void knapsack(int w[],int p[],int n,int m) {
    int v[100][100],i,j;
    for(i=0;i<=n;i++)
    {
        for(j=0;j<=m;j++)
        {
            if(i==0||j==0)
                v[i][j]=0;
            else if(w[i-1]<=j)
                v[i][j]=max(p[i-1]+v[i-1][j-w[i-1]],v[i-1][j]);
            else
                v[i][j]=v[i-1][j];
        }
    }
    printf("\n maximum profit=%d",v[n][m]);
}

int main() {
    int w[100],p[100],n,m,i;
    clrscr();
    printf("\n enter no of items=");
    scanf("%d",&n);
    printf("\n enter weights=");
    for(i=0;i<n;i++)
        scanf("%d",&w[i]);
    printf("\n enter profits=");
    for(i=0;i<n;i++)
        scanf("%d",&p[i]);
    printf("\n enter capacity=");
    scanf("%d",&m);
    knapsack(w,p,n,m);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c9">
#include<stdio.h>
#include<conio.h>

void bfs(int a[100][100],int n,int start) {
    int visited[100],queue[100];
    int front=0,rear=0,i,v;
    for(i=0;i<n;i++)
        visited[i]=0;
    queue[rear++]=start;
    visited[start]=1;
    printf("\n BFS traversal is:");
    while(front<rear)
    {
        v=queue[front++];
        printf(" %d",v+1);
        for(i=0;i<n;i++)
        {
            if(a[v][i]==1&&visited[i]==0)
            {
                queue[rear++]=i;
                visited[i]=1;
            }
        }
    }
}

int main() {
    int a[100][100],n,i,j,start;
    clrscr();
    printf("\n enter no of vertices=");
    scanf("%d",&n);
    printf("\n enter adjacency matrix=");
    for(i=0;i<n;i++)
    {
        for(j=0;j<n;j++)
            scanf("%d",&a[i][j]);
    }
    printf("\n enter starting vertex=");
    scanf("%d",&start);
    bfs(a,n,start-1);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="c10">
#include<stdio.h>
#include<conio.h>

int visited[100];

void dfs(int a[100][100],int n,int v) {
    int i;
    visited[v]=1;
    printf(" %d",v+1);
    for(i=0;i<n;i++)
    {
        if(a[v][i]==1&&visited[i]==0)
            dfs(a,n,i);
    }
}

int main() {
    int a[100][100],n,i,j,start;
    clrscr();
    printf("\n enter no of vertices=");
    scanf("%d",&n);
    printf("\n enter adjacency matrix=");
    for(i=0;i<n;i++)
    {
        for(j=0;j<n;j++)
            scanf("%d",&a[i][j]);
    }
    for(i=0;i<n;i++)
        visited[i]=0;
    printf("\n enter starting vertex=");
    scanf("%d",&start);
    printf("\n DFS traversal is:");
    dfs(a,n,start-1);
    getch();
    return 0;
}
</script>

<script>
var aims = [
  "Selection Sort",
  "Insertion Sort",
  "Quick Sort",
  "Binary Search",
  "Fractional Knapsack",
  "Kruskal's",
  "Prim's",
  "0/1 Knapsack",
  "BFS",
  "DFS"
];

function get(id) {
  return document.getElementById(id).textContent.replace(/^\n+|\n+$/g, "") + "\n";
}

var toastEl = document.getElementById("toast"), timer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
}

function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}

var grid = document.getElementById("grid");
for (var i = 1; i <= 10; i++) {
  (function (i) {
    var b = document.createElement("button");
    b.className = "item";
    b.type = "button";
    var label = aims[i - 1];
    b.innerHTML = "<b>" + i + ".</b> <span>" + label + "</span>";
    b.addEventListener("click", function () {
      copy(get("c" + i)).then(function (ok) {
        if (ok) {
          b.classList.add("done");
          toast("Copied: " + label);
          setTimeout(function () { b.classList.remove("done"); }, 1500);
        } else {
          toast("Copy failed - allow clipboard access");
        }
      });
    });
    grid.appendChild(b);
  })(i);
}
</script>
