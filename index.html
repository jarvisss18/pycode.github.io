<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Stack Java Programming – One-Click Copy</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.15rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:#666;font-size:.82rem}
h2{font-size:.85rem;margin:14px 0 6px;color:#333}
.row{display:flex;flex-wrap:wrap;gap:6px}
button.item{background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:5px 10px;font:inherit;font-size:.8rem;line-height:1.2;cursor:pointer}
button.item:hover{background:#f3f3f3;border-color:#888}
button.item:active{background:#e8e8e8}
button.item.done{background:#e8f7ec;border-color:#2e9e4f;color:#1b6b34}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:7px 14px;border-radius:6px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
<h1>Full Stack Java Programming</h1>
<p class="sub">Click a file to copy its code.</p>
<div id="root"></div>
</main>
<div id="toast"></div>
<script>
var DATA = [{"title": "Exp 1 – Classes and Objects with Looping and Branching", "files": [{"name": "TestRectangle.java", "code": "class Rectangle\n{\n    int length;\n    int width;\n    void insert(int l, int w)\n    {\n        length=l;\n        width=w;\n    }\n    void calculate()\n    {\n        System.out.println(length * width);\n    }\n}\npublic class TestRectangle\n{\n    public static void main(String args[])\n    {\n        Rectangle R1 = new Rectangle();\n        Rectangle R2 = new Rectangle();\n        R1.insert(11,5);\n        R2.insert(3,15);\n        R1.calculate();\n        R2.calculate();\n    }\n}\n"}, {"name": "Loop + branch snippet", "code": "int n = 5;\nfor (int i = 1; i <= n; i++)\n{\n    if (i % 2 == 0)\n        System.out.println(i + \" is even\");\n    else\n        System.out.println(i + \" is odd\");\n}\n"}]}, {"title": "Exp 2 – Method and Constructor Overloading", "files": [{"name": "TestSavingsAccount.java", "code": "class SavingsAccount\n{\n    double balance;\n    double interest;\n    public SavingsAccount()\n    {\n        balance=0;\n        interest=0;\n    }\n    public SavingsAccount(double Bal, double Int)\n    {\n        balance=Bal;\n        interest=Int;\n    }\n    public void deposite(double amt)\n    {\n        balance+=amt;\n    }\n    public void withdraw(double amt)\n    {\n        if(amt<=balance)\n        {\n            balance-=amt;\n        }\n        else\n        {\n            System.out.println(\"Insufficient funds\");\n        }\n    }\n    public void addinterest()\n    {\n        balance+=balance*(interest/100);\n    }\n    public double getBalance()\n    {\n        return balance;\n    }\n}\npublic class TestSavingsAccount\n{\n    public static void main(String args[])\n    {\n        SavingsAccount sa = new SavingsAccount(1000,10);\n        sa.withdraw(198);\n        sa.deposite(649);\n        sa.addinterest();\n        System.out.println(\"Final Balance=\" +sa.getBalance());\n    }\n}\n"}, {"name": "Addition.java", "code": "class Addition\n{\n    void add(int a, int b)\n    {\n        int c;\n        c=a+b;\n        System.out.println(\"The two nos. addition=\" + c);\n    }\n    void add(int a, int b, int c)\n    {\n        int d;\n        d=a+b+c;\n        System.out.println(\"The three nos. addition=\" + d);\n    }\n    public static void main(String args[])\n    {\n        Addition a = new Addition();\n        a.add(9,33);\n        a.add(4,95,695);\n    }\n}\n"}]}, {"title": "Exp 3 – Inheritance and Exception Handling", "files": [{"name": "Class3.java", "code": "class A\n{\n    private int i;\n    private String s;\n    public A()\n    {\n        System.out.println(\"Inside Default Constructor of A\");\n    }\n    public void setI(int i)\n    {\n        this.i = i;\n    }\n    public void setS(String s)\n    {\n        this.s = s;\n    }\n    public int getI()\n    {\n        return i;\n    }\n    public String getS()\n    {\n        return s;\n    }\n    public void display()\n    {\n        System.out.println(\"display function Inside class A\");\n    }\n}\nclass B extends A\n{\n    public B()\n    {\n        System.out.println(\"Inside Default Constructor of B\");\n    }\n    public void display()\n    {\n        System.out.println(\"display function Inside class B\");\n    }\n}\nclass C extends B\n{\n    public C()\n    {\n        System.out.println(\"Inside constructor of C\");\n    }\n    public void display()\n    {\n        System.out.println(\"display function Inside class C\");\n    }\n}\ninterface D1\n{\n    public void display1();\n}\ninterface D2\n{\n    public void display2();\n}\nclass D extends A implements D1, D2\n{\n    public void display1()\n    {\n        System.out.println(\"display1 of interface D1\");\n    }\n    public void display2()\n    {\n        System.out.println(\"display2 of interface D2\");\n    }\n}\npublic class Class3\n{\n    public static void main(String arg[])\n    {\n        System.out.println(\"Calling constructor of A\");\n        A a = new A();\n        System.out.println(\"Calling constructor of B\");\n        B b = new B();\n        System.out.println(\"Calling constructor of C\");\n        C c = new C();\n        System.out.println(\"Calling constructor of D\");\n        D d = new D();\n        d.display();\n        d.display1();\n        d.display2();\n        a.setS(\"akshay\");\n        a.setI(12);\n        a.display();\n        b.display();\n        c.display();\n    }\n}\n"}, {"name": "ExceptionDemo.java", "code": "class Division\n{\n    void divide(int a, int b)\n    {\n        try\n        {\n            int result = a / b;\n            System.out.println(\"Result = \" + result);\n        }\n        catch (ArithmeticException e)\n        {\n            System.out.println(\"Error: Division by zero is not allowed.\");\n        }\n    }\n}\npublic class ExceptionDemo\n{\n    public static void main(String[] args)\n    {\n        Division obj = new Division();\n        obj.divide(10, 2);\n        obj.divide(10, 0);\n    }\n}\n"}]}, {"title": "Exp 4 – Generic and HTTP Servlet", "files": [{"name": "FirstServlet.java", "code": "import java.io.*;\nimport javax.servlet.*;\n\npublic class FirstServlet extends GenericServlet\n{\n    public void service(ServletRequest req, ServletResponse resp)\n    throws ServletException, IOException\n    {\n        resp.setContentType(\"text/html\");\n\n        PrintWriter pw = resp.getWriter();\n\n        pw.println(\"<html>\");\n        pw.println(\"<head><title>My first Servlet<\/title><\/head>\");\n        pw.println(\"<body>\");\n        pw.println(\"<h2>Welcome To Servlet World!!!!<\/h2>\");\n        pw.println(\"<\/body>\");\n        pw.println(\"<\/html>\");\n\n        pw.close();\n    }\n}\n"}, {"name": "web.xml", "code": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee\n                             http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\n         version=\"3.1\">\n\n    <servlet>\n        <servlet-name>FirstServlet<\/servlet-name>\n        <servlet-class>FirstServlet<\/servlet-class>\n    <\/servlet>\n\n    <servlet-mapping>\n        <servlet-name>FirstServlet<\/servlet-name>\n        <url-pattern>/FirstServlet<\/url-pattern>\n    <\/servlet-mapping>\n\n<\/web-app>\n"}]}, {"title": "Exp 5 – Static Website (HTML, CSS, JS)", "files": [{"name": "Webpage.html", "code": "<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"UTF-8\" name=\"viewport\"/>\n        <title>My Static Website<\/title>\n        <link rel=\"stylesheet\" href=\"style.css\" />\n    <\/head>\n    <body>\n        <header>\n            <h1>Welcome to My Static Website<\/h1>\n            <nav>\n                <ul>\n                    <li><a href=\"#\">Home<\/a><\/li>\n                    <li><a href=\"#\">About<\/a><\/li>\n                    <li><a href=\"#\">Contact<\/a><\/li>\n                <\/ul>\n            <\/nav>\n        <\/header>\n        <main>\n            <section>\n                <h2>Hello, Dear Student!<\/h2>\n                <p>This is a sample static website built using HTML, CSS, and JavaScript.<\/p>\n                <button onClick=\"showMessage()\">Click Me<\/button>\n                <p id=\"message\"><\/p>\n            <\/section>\n        <\/main>\n\n        <footer>\n            <p>&copy; 2025 Full Stack Java Syllabus Setter<\/p>\n        <\/footer>\n\n        <script src=\"script.js\"><\/script>\n    <\/body>\n<\/html>\n"}, {"name": "style.css", "code": "body\n{\n    font-family: Arial, sans-serif;\n    margin: 0;\n    padding: 0;\n    background-color: #f9f9f9;\n    color: #333;\n}\n\nheader\n{\n    background-color: #007acc;\n    color: white;\n    padding: 20px;\n    text-align: center;\n}\n\nnav ul\n{\n    list-style: none;\n    padding: 0;\n    display: flex;\n    justify-content: center;\n    margin-top: 10px;\n}\n\nnav li\n{\n    margin: 0 15px;\n}\n\nnav a\n{\n    color: white;\n    text-decoration: none;\n    font-weight: bold;\n}\n\nmain\n{\n    padding: 20px;\n    text-align: center;\n}\n\nbutton\n{\n    padding: 10px 20px;\n    font-size: 16px;\n    cursor: pointer;\n}\n\nfooter\n{\n    background-color: #eee;\n    text-align: center;\n    padding: 15px;\n    margin-top: 40px;\n}\n"}, {"name": "script.js", "code": "function showMessage()\n{\n    const message = document.getElementById(\"message\");\n    message.textContent = \"Thank you for clicking! Enjoy browsing \";\n}\n"}]}, {"title": "Exp 6 – JavaScript Email Validation", "files": [{"name": "webpage1.html", "code": "<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"UTF-8\" />\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"/>\n        <title>Email Validation<\/title>\n        <link rel=\"stylesheet\" href=\"style.css\" />\n    <\/head>\n    <body>\n        <header>\n            <h1>Welcome to My Static Website<\/h1>\n            <nav>\n                <ul>\n                    <li><a href=\"#\">Home<\/a><\/li>\n                    <li><a href=\"#\">About<\/a><\/li>\n                    <li><a href=\"#\">Contact<\/a><\/li>\n                <\/ul>\n            <\/nav>\n        <\/header>\n        <main>\n            <section>\n                <h2>Hello, Dear Students!<\/h2>\n                <p>This is a sample static website built using HTML, CSS, and JavaScript.<\/p>\n                <button onclick=\"showMessage()\">Click Me<\/button>\n                <p id=\"message\"><\/p>\n                <h3>Subscribe to our Newsletter<\/h3>\n                <input type=\"text\" id=\"email\" placeholder=\"Enter your email\" />\n                <button onclick=\"validateEmail()\">Submit<\/button>\n            <\/section>\n        <\/main>\n\n        <footer>\n            <p>&copy; 2025 FullStackJavaSyllabusSetter<\/p>\n        <\/footer>\n\n        <script src=\"script.js\"><\/script>\n    <\/body>\n<\/html>\n"}, {"name": "style1.css", "code": "body\n{\n    font-family: Arial, sans-serif;\n    margin: 0;\n    padding: 0;\n    background-color: #f9f9f9;\n    color: #333;\n}\n\nheader\n{\n    background-color: #007acc;\n    color: white;\n    padding: 20px;\n    text-align: center;\n}\n\nnav ul\n{\n    list-style: none;\n    padding: 0;\n    display: flex;\n    justify-content: center;\n    margin-top: 10px;\n}\n\nnav li\n{\n    margin: 0 15px;\n}\n\nnav a\n{\n    color: white;\n    text-decoration: none;\n    font-weight: bold;\n}\n\nmain\n{\n    padding: 20px;\n    text-align: center;\n}\n\nbutton\n{\n    padding: 10px 20px;\n    font-size: 16px;\n    cursor: pointer;\n}\n\nfooter\n{\n    background-color: #eee;\n    text-align: center;\n    padding: 15px;\n    margin-top: 40px;\n}\n"}, {"name": "script1.js", "code": "function showMessage() {\n    const message = document.getElementById(\"message\");\n    message.textContent = \"Thank you for clicking! Enjoy browsing \";\n}\n\nfunction validateEmail() {\n    const emailInput = document.getElementById(\"email\");\n    const email = emailInput.value;\n    if (email.indexOf(\"@\") === -1 || email.indexOf(\".\") === -1) {\n        alert(\"Invalid email address. Please include '@' and '.' characters.\");\n        emailInput.focus();\n        return false;\n    }\n    alert(\"Email is valid!\");\n    return true;\n}\n"}]}, {"title": "Exp 7 – JSP Implicit Objects", "files": [{"name": "First.jsp", "code": "<html>\n    <head>\n        <title>First Program<\/title>\n    <\/head>\n    <body>\n        <h1>Output of JSP file<\/h1>\n\n        <%\n            out.println(\"Hello World\");\n        %>\n\n    <\/body>\n<\/html>\n"}]}];

var toastEl = document.getElementById("toast"), timer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
}

function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}

var root = document.getElementById("root");
DATA.forEach(function (g) {
  var h = document.createElement("h2");
  h.textContent = g.title;
  root.appendChild(h);
  var row = document.createElement("div");
  row.className = "row";
  g.files.forEach(function (f) {
    var b = document.createElement("button");
    b.className = "item";
    b.type = "button";
    b.textContent = f.name;
    b.addEventListener("click", function () {
      copy(f.code).then(function (ok) {
        if (ok) {
          b.classList.add("done");
          toast("Copied: " + f.name);
          setTimeout(function () { b.classList.remove("done"); }, 1500);
        } else {
          toast("Copy failed - allow clipboard access");
        }
      });
    });
    row.appendChild(b);
  });
  root.appendChild(row);
});
</script>
</body>
</html>
